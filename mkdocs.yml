site_name: Session-persistent TTT
site_description: Code and documentation for the gated carry
site_url: ""

docs_dir: docs
site_dir: site

repo_url: https://github.com/Suchitra-idu/Our-TTT
repo_name: Suchitra-idu/Our-TTT
edit_uri: edit/main/docs/

# Links that leave docs/ (source files, ARCHITECTURE.md, REBUILD_PLAN.md) are rewritten
# to repo URLs at build time, so they stay relative and clickable in an editor.
hooks:
  - hooks/repo_links.py

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: README.md
  - Method: mechanism.md
  - How the code fits together: codebase.md
  - Evaluation suites: evaluation.md
  - Reproducing the paper: reproducing.md
  - From findings to code: research.md
  - Glossary: glossary.md
  - Maps:
      - ttt/core: core-map.md
      - ttt/extensions: extensions-map.md
      - ttt/ports and ttt/adapters: ports-map.md
      - ttt/app: app-map.md
      - ttt/cli.py and ttt/experiments: experiments-map.md
  - Testing: testing.md
